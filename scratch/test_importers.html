<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Importers Test</title>
</head>
<body>
  <div id="results">Running tests...</div>
  <script type="module">
    import { 
      parseImportData, 
      autoDetectService, 
      parseQuizlet, 
      parseAnki, 
      parseRemNote, 
      parseBrainscape, 
      parseCram, 
      parseKnowt 
    } from '../js/importers.js';

    window.testResults = [];

    function assert(name, condition, details = '') {
      if (condition) {
        window.testResults.push({ name, status: 'PASS' });
      } else {
        window.testResults.push({ name, status: 'FAIL', details });
        console.error('Test Failed:', name, details);
      }
    }

    async function runAllTests() {
      // 1. Quizlet Test
      const quizletText = `mitochondria\tpowerhouse of the cell
ribosome\tprotein synthesis machine
\tinvalid term without front
valid front\t
valid question\tvalid answer`;
      const qRes = parseQuizlet(quizletText);
      assert('Quizlet: valid cards count', qRes.cards.length === 3, `Expected 3, got ${qRes.cards.length}`);
      assert('Quizlet: skipped warnings count', qRes.warnings.length === 2, `Expected 2 warnings, got ${qRes.warnings.length}`);
      assert('Quizlet: card front', qRes.cards[0].front === 'mitochondria');

      // 2. Anki Test (Plain text with cloze & HTML)
      const ankiText = `#separator:tab
#html:true
#tags column:3
What is ATP?\t<b>Adenosine Triphosphate</b>, the cell's energy currency.\tbiology science
The {{c1::mitochondria}} generates cellular energy.\tMitochondria ATP\tbiology
\tEmpty front card\t
Empty back card\t\t`;
      const ankiRes = parseAnki(ankiText);
      assert('Anki: valid cards count', ankiRes.cards.length === 2, `Expected 2, got ${ankiRes.cards.length}`);
      assert('Anki: cloze card detection', ankiRes.cards[1].type === 'cloze', `Expected cloze type, got ${ankiRes.cards[1].type}`);
      assert('Anki: tags extracted', ankiRes.cards[0].tags.includes('biology'));

      // 3. RemNote Test (::, :::, ;;, cloze)
      const remNoteText = `DNA :: Deoxyribonucleic Acid
Photosynthesis ::: Light to chemical energy
The {{mitochondria}} is the powerhouse.
Multiline question;;
Line 1 answer
Line 2 answer
Incomplete ::
::: Incomplete reverse`;
      const remRes = parseRemNote(remNoteText);
      assert('RemNote: cards count', remRes.cards.length === 4, `Expected 4, got ${remRes.cards.length}`);
      assert('RemNote: reversible detected', remRes.cards.some(c => c.type === 'reversible'));
      assert('RemNote: cloze detected', remRes.cards.some(c => c.type === 'cloze'));
      assert('RemNote: multiline handled', remRes.cards.some(c => c.back.includes('Line 1 answer')));

      // 4. Brainscape Test (CSV with header and quotes)
      const brainscapeText = `"Question","Answer","Topic"
"What is H2O?","Water","Chemistry"
"What is NaCl?","Sodium Chloride (Table Salt)","Chemistry"
"","Missing question",""`;
      const bsRes = parseBrainscape(brainscapeText);
      assert('Brainscape: valid count', bsRes.cards.length === 2, `Expected 2, got ${bsRes.cards.length}`);
      assert('Brainscape: question parsed', bsRes.cards[0].front === 'What is H2O?');

      // 5. Cram.com Test (TSV with hint)
      const cramText = `Au\tGold\tSymbol for gold
Fe\tIron\tSymbol for iron`;
      const cramRes = parseCram(cramText);
      assert('Cram: count', cramRes.cards.length === 2);
      assert('Cram: hint extracted', cramRes.cards[0].hint === 'Symbol for gold');

      // 6. Knowt JSON Test
      const knowtJson = JSON.stringify([
        { term: "Speed of Light", definition: "299,792,458 m/s" },
        { term: "Planck Constant", definition: "6.626e-34 J*s" }
      ]);
      const knowtRes = parseKnowt(knowtJson);
      assert('Knowt: json cards count', knowtRes.cards.length === 2);

      // 7. Auto-detect Test
      assert('Auto-detect Quizlet', autoDetectService("term\tdef\nterm2\tdef2") === 'quizlet');
      assert('Auto-detect Anki', autoDetectService("#separator:tab\nfront\tback") === 'anki');
      assert('Auto-detect RemNote', autoDetectService("word :: definition") === 'remnote');
      assert('Auto-detect Brainscape', autoDetectService('"Question","Answer"\n"q","a"') === 'brainscape');

      document.getElementById('results').textContent = JSON.stringify(window.testResults, null, 2);
      console.log('All tests completed:', window.testResults);
    }

    runAllTests();
  </script>
</body>
</html>
