<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyCards | Spaced Repetition Flashcards</title>
  <meta name="description" content="A clean, student-friendly flashcard app with spaced repetition, image occlusion, cloze deletions, and hierarchical deck organization." />

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c05638" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="StudyCards" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Google Fonts: Plus Jakarta Sans & Lora (Warm Humanist & Editorial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/study.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Global App Header -->
  <header class="app-navbar">
    <div class="nav-container">
      <div class="nav-brand" data-view="dashboard">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
        </div>
        <span class="brand-name">Study<span class="brand-accent">Cards</span></span>
      </div>

      <nav class="nav-menu">
        <button class="nav-link active" data-view="dashboard" title="Dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="nav-link-text">Dashboard</span>
        </button>
        <button class="nav-link" data-view="decks" title="Folders & Decks">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span class="nav-link-text">Folders &amp; Decks</span>
          <span class="nav-link-short">Decks</span>
        </button>
      </nav>

      <div class="nav-actions">
        <!-- PWA Install Button (Appears on Chromebook / Desktop Chrome) -->
        <button class="btn btn-outline btn-sm hidden" id="nav-btn-install" title="Install StudyCards as a desktop app">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span class="nav-btn-label">Install App</span>
        </button>

        <button class="btn btn-primary btn-sm" id="nav-btn-new-card">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="nav-btn-label">New Card</span>
        </button>

        <button class="btn btn-secondary btn-sm" id="nav-btn-share" title="Import from Quizlet, Anki, RemNote or Backup Decks">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
          <span class="nav-btn-label">Import / Export</span>
        </button>

        <button class="btn btn-icon btn-ghost" id="nav-theme-toggle" title="Toggle Light / Dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>

        <button class="btn btn-icon btn-ghost" id="nav-btn-settings" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- App Main Content Area -->
  <main id="app-main" class="app-main-viewport"></main>

  <!-- Application Script -->
  <script type="module" src="js/app.js"></script>

  <!-- Fallback guidance if opened directly via file:// instead of a web server -->
  <script>
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const appMain = document.getElementById('app-main');
          if (appMain && !appMain.children.length) {
            const warningEl = document.createElement('div');
            warningEl.style.cssText = 'max-width: 640px; margin: 3.5rem auto; padding: 2rem; background: var(--bg-surface, #ffffff); border: 2px solid var(--primary, #c05638); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); font-family: inherit; color: var(--text-main, #2d3748); line-height: 1.6;';
            warningEl.innerHTML = `
              <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem;">
                <span style="font-size:2rem;">⚠️</span>
                <h2 style="margin:0; font-size:1.4rem; color:var(--primary, #c05638);">Local Web Server Required</h2>
              </div>
              <p style="margin-bottom:1rem; font-size:0.95rem;">
                This app uses modern JavaScript ES Modules, IndexedDB storage, and Service Workers. Web browsers block ES modules when opened directly from a local folder (<code>file:///</code>) due to CORS security rules.
              </p>
              <div style="background:var(--bg-subtle, #f8f9fa); border:1px solid var(--border-color, #e2e8f0); border-radius:8px; padding:1.1rem; margin-bottom:1.25rem;">
                <div style="font-weight:600; margin-bottom:0.6rem;">⚡ How to run locally:</div>
                <ol style="margin:0; padding-left:1.25rem; font-size:0.92rem;">
                  <li style="margin-bottom:0.6rem;">
                    <strong>Double-click <code>scratch/Run App.bat</code></strong> (or run a local web server).
                  </li>
                  <li style="margin-bottom:0.6rem;">
                    Or run this in terminal / PowerShell:
                    <div style="background:#1a202c; color:#63b3ed; padding:0.45rem 0.75rem; border-radius:6px; font-family:monospace; margin-top:0.35rem; font-size:0.88rem;">
                      python -m http.server 8000
                    </div>
                  </li>
                  <li>
                    Then open <a href="http://localhost:8000" style="color:var(--primary, #c05638); font-weight:600;" target="_blank">http://localhost:8000</a> in your browser.
                  </li>
                </ol>
              </div>
              <p style="font-size:0.85rem; color:var(--text-muted, #718096); margin:0;">
                ℹ️ <em>Once pushed to GitHub Pages or hosted online (<code>https://</code>), this error does not appear and the app works automatically.</em>
              </p>
            `;
            appMain.appendChild(warningEl);
          }
        }, 150);
      });
    }
  </script>
</body>
</html>
